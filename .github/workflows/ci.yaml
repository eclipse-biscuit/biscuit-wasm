name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
            ${{ runner.os }}-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install wasm-pack
        run: |
          npm install -g wasm-pack
      - name: Run rust checks
        run: |
          cargo clippy -- -D warnings
          cargo fmt --check
      - name: Build JS lib
        run: |
          npm install
          npm run prepare-package
      - name: Run JS tests
        run: |
          cd js-tests
          npm install
          npm test
      - name: Run node JS example
        run: |
          cd examples/node
          npm install
          npm start
      - name: Build frontend JS example
        run: |
          cd examples/frontend
          npm install
          npm run build

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Eclipse Dash license tool
        id: dash-cache
        uses: actions/cache@v4
        with:
          path: dash-licenses.jar
          key: dash-licenses-${{ env.DASH_VERSION }}
      - name: Download the Eclipse Dash license tool
        if: steps.dash-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o dash-licenses.jar \
            https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
      - name: Verify the Eclipse Dash license tool
        run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
      - name: Check dependency licenses
        # the tool exits with the number of dependencies that are not approved
        shell: bash
        run: |
          cargo tree -e normal --prefix none --no-dedupe \
            | sort -u \
            | grep -v '^[[:space:]]*$' \
            | grep -v biscuit \
            | sed -E 's|([^ ]+) v([^ ]+).*|crate/cratesio/-/\1/\2|' \
            | java -jar dash-licenses.jar -summary DEPENDENCIES -
      - name: Upload the license summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-licenses
          path: DEPENDENCIES
